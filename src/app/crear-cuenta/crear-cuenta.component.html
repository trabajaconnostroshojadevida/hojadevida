<div class="bg-gray-50 font-[sans-serif]">
  <div class="min-h-screen flex flex-col items-center justify-center py-6 px-4">
    <div class="max-w-md w-full">

      <div class="p-8 rounded-2xl bg-white shadow-xl border border-gray-100">
        <div class="text-center mb-10">
          <img src="assets/iconos/lo2.png" alt="VERCHA" class="h-10 w-auto mx-auto mb-4">
          <h2 class="text-gray-900 text-2xl font-black tracking-tight uppercase">Crear Cuenta</h2>
          <p class="text-gray-500 text-sm mt-2">Únete a la experiencia Vercha</p>
        </div>

        <form class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-gray-700 text-xs font-bold uppercase tracking-wider mb-2 block">Nombre</label>
              <div class="relative flex items-center">
                <input [(ngModel)]="firstName" name="firstName" type="text" required
                  class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                  placeholder="Tu nombre" />
              </div>
            </div>
            <div>
              <label class="text-gray-700 text-xs font-bold uppercase tracking-wider mb-2 block">Apellido</label>
              <div class="relative flex items-center">
                <input [(ngModel)]="lastName" name="lastName" type="text" required
                  class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                  placeholder="Tu apellido" />
              </div>
            </div>
          </div>

          <div>
            <label class="text-gray-700 text-xs font-bold uppercase tracking-wider mb-2 block">Correo
              Electrónico</label>
            <div class="relative flex items-center">
              <input [(ngModel)]="email" name="username" type="email" required
                class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                placeholder="ejemplo@correo.com" />
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute right-4 text-gray-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </div>
          </div>

          <div>
            <label class="text-gray-700 text-xs font-bold uppercase tracking-wider mb-2 block">Contraseña</label>
            <div class="relative flex items-center">
              <input [(ngModel)]="password" name="password" type="password" required
                class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                placeholder="Mínimo 6 caracteres" />
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute right-4 text-gray-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
          </div>

          <div class="pt-4">
            <button (click)="registerWithEmail()" type="button"
              class="w-full py-4 px-4 text-sm font-bold tracking-widest rounded-xl text-white bg-primary hover:bg-primary-dark transition-all transform active:scale-95 shadow-lg shadow-primary/20">
              REGISTRARSE
            </button>
          </div>

          <p class="text-gray-600 text-sm text-center pt-6">
            ¿Ya tienes una cuenta?
            <a routerLink="/iniciarSesion" class="text-accent hover:underline font-bold ml-1">Inicia sesión</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
