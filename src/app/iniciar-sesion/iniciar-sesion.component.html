<div class="bg-gray-50 font-[sans-serif]">
  <div class="min-h-screen flex flex-col items-center justify-center py-6 px-4">
    <div class="max-w-md w-full">

      <div class="p-8 rounded-2xl bg-white shadow-xl border border-gray-100">
        <div class="text-center mb-10">
          <img src="assets/iconos/lo2.png" alt="VERCHA" class="h-10 w-auto mx-auto mb-4">
          <h2 class="text-gray-900 text-2xl font-black tracking-tight uppercase">Iniciar Sesión</h2>
          <p class="text-gray-500 text-sm mt-2">Bienvenido de nuevo a Vercha</p>
        </div>

        <form class="space-y-4">
          <div>
            <label class="text-gray-700 text-xs font-bold uppercase tracking-wider mb-2 block">Correo
              Electrónico</label>
            <div class="relative flex items-center">
              <input [(ngModel)]="email" name="username" type="email" required
                class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                placeholder="ejemplo@correo.com" />
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute right-4 text-gray-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-gray-700 text-xs font-bold uppercase tracking-wider block">Contraseña</label>
              <a (click)="olvidoContrasena()"
                class="text-accent text-[10px] uppercase font-bold hover:underline cursor-pointer">¿Olvidaste tu
                contraseña?</a>
            </div>
            <div class="relative flex items-center">
              <input [(ngModel)]="password" name="password" (keydown.enter)="loginWithEmail()"
                [type]="showPassword ? 'text' : 'password'" required
                class="w-full text-gray-800 text-sm border border-gray-200 px-4 py-3.5 rounded-xl outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-gray-50/50"
                placeholder="Ingresa tu contraseña" />

              <!-- Password Toggle SVG Icons -->
              <button type="button" (click)="togglePassword()"
                class="absolute right-4 text-gray-400 hover:text-accent transition-colors">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7s-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7 .746-2.356 2.15-4.412 4.025-5.882M9.53 9.53A3 3 0 0115 12m3.386-3.386A9.99 9.99 0 0121.542 12c-1.274 4.057-5.065 7-9.542 7-1.182 0-2.317-.206-3.375-.585M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="pt-6">
            <button (click)="loginWithEmail()" type="button"
              class="w-full py-4 px-4 text-sm font-bold tracking-widest rounded-xl text-white bg-primary hover:bg-primary-dark transition-all transform active:scale-95 shadow-lg shadow-primary/20">
              INGRESAR
            </button>
          </div>

          <p class="text-gray-600 text-sm text-center pt-8">
            ¿No tienes una cuenta?
            <a (click)="redirectToRegister()"
              class="text-accent hover:underline font-bold ml-1 cursor-pointer">Regístrate aquí</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
